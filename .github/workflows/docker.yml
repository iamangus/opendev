name: Docker Image CI

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Login to GitHub Container Registry
      run: echo "${{ github.token }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

    - name: Set timestamp tag
      id: vars
      run: echo "tag=$(date +%s)" >> $GITHUB_OUTPUT

    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag ghcr.io/iamangus/opendev:latest

    - name: Push the latest Docker image
      run: docker push ghcr.io/iamangus/opendev:latest

    - name: Retag with timestamp
      run: docker tag ghcr.io/iamangus/opendev:latest ghcr.io/iamangus/opendev:${{ steps.vars.outputs.tag }}

    - name: Push the timestamped Docker image
      run: docker push ghcr.io/iamangus/opendev:${{ steps.vars.outputs.tag }}
