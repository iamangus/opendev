name: Docker Image CI

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go test -race -tags=integration ./...
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false

    - name: Login to GitHub Container Registry
      if: github.event_name != 'pull_request'
      run: echo "${{ github.token }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

    - name: Set timestamp tag
      id: vars
      run: echo "tag=$(date +%s)" >> $GITHUB_OUTPUT

    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag ghcr.io/iamangus/opendev:latest

    - name: Push the latest Docker image
      if: github.event_name != 'pull_request'
      run: docker push ghcr.io/iamangus/opendev:latest

    - name: Retag with timestamp
      run: docker tag ghcr.io/iamangus/opendev:latest ghcr.io/iamangus/opendev:${{ steps.vars.outputs.tag }}

    - name: Push the timestamped Docker image
      if: github.event_name != 'pull_request'
      run: docker push ghcr.io/iamangus/opendev:${{ steps.vars.outputs.tag }}

    - name: Publish immutable source tag
      if: github.event_name != 'pull_request'
      run: |
        docker tag ghcr.io/iamangus/opendev:latest ghcr.io/iamangus/opendev:sha-${{ github.sha }}
        docker push ghcr.io/iamangus/opendev:sha-${{ github.sha }}
